name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # 快取 ~/.npm，加速 npm ci
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/interview-cheatsheet/browser

  docker:
    needs: test-and-build # 測試通過才建映像檔
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-cheatsheet:${{ github.sha }} .
